[package]
name = "wflow"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
miette = { version = "7", features = ["fancy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tiktoken-rs = "0.11"
toml = "0.9"

[dev-dependencies]
tempfile = "3"

[lib]
path = "lib.rs"

[[bin]]
name = "wflow"
path = "main.rs"
